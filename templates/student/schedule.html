{% extends "layouts/student_base.html" %}

{% block title %}My Schedule{% endblock %}

{% block student_content %}
<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
    <h1 class="h2">My Schedule</h1>
</div>

<div class="alert alert-info">
    <i class="fas fa-info-circle"></i> Class schedule feature is coming soon!
</div>

<div class="card shadow mb-4">
    <div class="card-header py-3">
        <h6 class="m-0 font-weight-bold text-primary">Schedule Overview</h6>
    </div>
    <div class="card-body">
        <div class="text-center py-5">
            <i class="fas fa-calendar-alt fa-4x text-gray-300 mb-3"></i>
            <p>Your class schedule will appear here once configured by the administrator.</p>
        </div>
    </div>
</div>
{% endblock %}
